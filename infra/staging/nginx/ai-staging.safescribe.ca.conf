upstream safescribe_ai {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Cloudflare terminates TLS for ai-staging; origin serves HTTP on :80.
# (Letsencrypt cert for ai-staging is optional — do not require it on origin.)
server {
    listen 80;
    listen [::]:80;
    server_name ai-staging.safescribe.ca;

    client_max_body_size 30m;

    access_log /var/log/nginx/ai-staging.access.log;
    error_log  /var/log/nginx/ai-staging.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://safescribe_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location = /health/ready {
        proxy_pass http://safescribe_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        limit_req zone=ai_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://safescribe_ai;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
