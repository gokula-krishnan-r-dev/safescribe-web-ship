# SafeScribe staging — data plane only (Postgres + Redis)
# App processes (API / AI) run on the host via PM2 + systemd for lighter memory use.
services:
  postgres:
    image: postgres:16-alpine
    container_name: safescribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safescribe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: safescribe
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safescribe -d safescribe']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: safescribe-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --bind
      - 0.0.0.0
      - --protected-mode
      - yes
      - --save
      - '60'
      - '100'
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'

volumes:
  postgres_data:
  redis_data:
