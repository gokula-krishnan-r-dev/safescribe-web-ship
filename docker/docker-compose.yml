services:
  ai-engine:
    build:
      context: ../apps/ai-engine
      dockerfile: Dockerfile
    container_name: safescript-ai-engine
    restart: unless-stopped
    ports:
      # Host 8010 avoids clashes with unrelated local proxies often bound to :8000
      - '8010:8000'
    env_file:
      - ../apps/ai-engine/.env
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  postgres:
    image: postgres:16-alpine
    container_name: safescript-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: safescript
      POSTGRES_PASSWORD: safescript
      POSTGRES_DB: safescript
    ports:
      # Default 5432. Set POSTGRES_PORT in the repo-root .env if Homebrew/local
      # Postgres already owns 5432 (common on macOS).
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safescript']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safescript-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: safescript-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  redis_data:
