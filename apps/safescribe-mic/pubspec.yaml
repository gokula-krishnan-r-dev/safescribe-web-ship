name: safescribe_mic
description: SafeScribe Mic — phone companion microphone for consultations.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  record: ^6.0.0
  speech_to_text: ^7.0.0
  app_links: ^6.3.3
  permission_handler: ^11.3.1
  crypto: ^3.0.6
  uuid: ^4.5.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.2.10
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
