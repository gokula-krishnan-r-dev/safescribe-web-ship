# Generate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/ic_launcher_source.png
  adaptive_icon_background: '#0B1220'
  adaptive_icon_foreground: assets/brand/ic_launcher_foreground.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  min_sdk_android: 23
